<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0614">
<title>For you 💗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=Manrope:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============ BASE ============ */
:root{
  --bg:#0b0614; --plum:#22093a; --pink:#ff4d8d; --rose:#ff8fb3; --ember:#ff3b5c; --ink:#fbeaf2;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;background:var(--bg);color:var(--ink);font-family:var(--sans)}
body{
  background:
   radial-gradient(60% 45% at 20% 10%,rgba(255,77,141,.22),transparent 70%),
   radial-gradient(55% 50% at 85% 90%,rgba(120,40,200,.35),transparent 70%),
   linear-gradient(180deg,#0b0614,#1a0830 60%,#0b0614);
}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
#hearts,#taps{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:2}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}

/* Emotional glow: toggled with body.emo */
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:3;opacity:0;transition:opacity 2s;
  box-shadow:inset 0 0 140px 10px rgba(255,59,92,.35);animation:glowPulse 3.2s ease-in-out infinite}
body.emo::after{opacity:1}
@keyframes glowPulse{50%{box-shadow:inset 0 0 200px 24px rgba(255,77,141,.45)}}

/* ============ SCREENS ============ */
.screen{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:max(24px,env(safe-area-inset-top)) 24px max(24px,env(safe-area-inset-bottom));text-align:center;
  opacity:0;visibility:hidden;transition:opacity 1s ease,visibility 1s}
.screen.on{opacity:1;visibility:visible}

h1,.serif{font-family:var(--serif);font-style:italic;font-weight:600;letter-spacing:.2px}
.hello{font-size:clamp(30px,8.4vw,48px);line-height:1.15;max-width:15ch;text-shadow:0 0 28px rgba(255,77,141,.55)}
.sub{margin-top:14px;font-size:clamp(14px,3.9vw,17px);color:var(--rose);opacity:.9;letter-spacing:.3px}
.hint{margin-top:34px;font-size:13px;color:rgba(251,234,242,.55);animation:blink 2.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}

/* ============ GIFT BOX (pure CSS) ============ */
.gift{position:relative;width:170px;height:180px;margin-top:44px;cursor:pointer;animation:bob 3s ease-in-out infinite;
  filter:drop-shadow(0 0 26px rgba(255,77,141,.65))}
@keyframes bob{50%{transform:translateY(-10px) rotate(-1.5deg)}}
.gift .box{position:absolute;left:12px;right:12px;bottom:0;height:104px;border-radius:10px;
  background:linear-gradient(160deg,#ff5c95,#b8124f);box-shadow:inset 0 -14px 24px rgba(0,0,0,.28)}
.gift .box::before,.gift .lid::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:22px;transform:translateX(-50%);
  background:linear-gradient(90deg,#ffd9e6,#fff2f7,#ffd9e6)}
.gift .lid{position:absolute;left:0;right:0;bottom:100px;height:44px;border-radius:10px;
  background:linear-gradient(160deg,#ff77a8,#cf1a5b);transform-origin:0 100%;transition:transform 1s cubic-bezier(.3,1.4,.5,1),opacity .8s .6s}
.gift .bow{position:absolute;left:50%;top:-26px;width:60px;height:34px;transform:translateX(-50%)}
.gift .bow i{position:absolute;top:0;width:28px;height:28px;border:6px solid #fff2f7;border-radius:50% 50% 50% 0}
.gift .bow i:first-child{left:0;transform:rotate(-30deg)}
.gift .bow i:last-child{right:0;transform:scaleX(-1) rotate(-30deg)}
.gift .beam{position:absolute;left:50%;bottom:90px;width:150px;height:260px;transform:translateX(-50%) scaleY(0);transform-origin:50% 100%;
  background:linear-gradient(to top,rgba(255,200,225,.9),rgba(255,77,141,0));clip-path:polygon(30% 100%,70% 100%,100% 0,0 0);
  transition:transform .9s .25s ease-out;opacity:.85}
.gift.open{animation:none;transform:scale(1.08)}
.gift.open .lid{transform:translate(-26px,-70px) rotate(-24deg);opacity:0}
.gift.open .beam{transform:translateX(-50%) scaleY(1)}

/* ============ VIDEO ============ */
#video-screen{padding:0;background:#05020b}
.stage{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.stage::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 40% at 50% 50%,rgba(255,77,141,.25),transparent 75%)}
video{position:relative;width:100%;max-height:100%;object-fit:contain;background:#000;
  box-shadow:0 0 70px rgba(255,77,141,.35);opacity:0;transition:opacity 1.2s}
video.ready{opacity:1}
.bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.12);z-index:6}
.bar b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),#ffd0e0);box-shadow:0 0 10px var(--pink)}
.ctrl{position:absolute;top:max(14px,env(safe-area-inset-top));z-index:9;width:46px;height:46px;border-radius:50%;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  font-size:19px;display:grid;place-items:center;transition:transform .2s,box-shadow .3s;box-shadow:0 0 16px rgba(255,77,141,.3)}
.ctrl:active{transform:scale(.9)}
#muteBtn{right:14px;position:fixed;z-index:20;opacity:0;pointer-events:none;transition:opacity .8s}
#muteBtn.show{opacity:1;pointer-events:auto}
#fsBtn{right:14px;top:calc(max(14px,env(safe-area-inset-top)) + 58px)}

/* Glass cards + placeholder */
.glass{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:26px;
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 10px 50px rgba(0,0,0,.45),0 0 40px rgba(255,77,141,.18)}
#ph{position:absolute;z-index:7;max-width:320px;padding:30px 24px;display:none}
#ph.on{display:block}
#ph .serif{font-size:26px}
#ph p{margin:10px 0 20px;font-size:14px;color:var(--rose)}

.btn{padding:15px 30px;border-radius:999px;font-size:16px;font-weight:500;color:#fff;
  background:linear-gradient(135deg,var(--pink),var(--ember));box-shadow:0 0 28px rgba(255,59,92,.6),inset 0 1px 0 rgba(255,255,255,.4);
  transition:transform .2s}
.btn:active{transform:scale(.95)}
.btn.ghost{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);box-shadow:none;font-size:14px;padding:11px 22px}

/* ============ FINAL ============ */
.fade{opacity:0;transform:translateY(14px);filter:blur(6px);transition:opacity 1.4s,transform 1.4s,filter 1.4s}
.fade.in{opacity:1;transform:none;filter:none}
.m1{font-size:clamp(26px,7vw,40px);line-height:1.25;max-width:17ch;text-shadow:0 0 26px rgba(255,77,141,.5)}
.m2{margin-top:26px;min-height:7.5em;max-width:30ch;font-size:clamp(16px,4.4vw,19px);line-height:1.7;color:#ffe3ee;padding:20px 22px;width:min(88vw,380px)}
.m2.hide{visibility:hidden}
.caret::after{content:"";display:inline-block;width:2px;height:1.1em;margin-left:2px;vertical-align:-3px;background:var(--rose);animation:blink .8s steps(1) infinite}
.heart{font-size:64px;margin-top:22px;line-height:1;animation:beat 1.25s ease-in-out infinite;filter:drop-shadow(0 0 22px var(--pink)) drop-shadow(0 0 50px var(--ember))}
@keyframes beat{0%,40%,100%{transform:scale(1)}12%{transform:scale(1.22)}26%{transform:scale(1.06)}33%{transform:scale(1.18)}}
.row{margin-top:26px;display:flex;flex-direction:column;gap:12px;align-items:center}

/* Secret message */
#secret{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:24px;
  background:rgba(8,2,16,.78);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;visibility:hidden;transition:opacity 1.2s,visibility 1.2s}
#secret.on{opacity:1;visibility:visible}
#secret .glass{padding:38px 26px;max-width:360px;text-align:center;transform:scale(.8) translateY(30px);filter:blur(10px);transition:transform 1.6s cubic-bezier(.2,1,.3,1),filter 1.6s}
#secret.on .glass{transform:none;filter:none}
#secret .serif{font-size:clamp(25px,7vw,32px);line-height:1.3}
#secret p{margin:16px 0 24px;line-height:1.7;color:#ffd9e6;font-size:15.5px}
.sig{font-family:var(--serif);font-style:italic;font-size:22px;color:var(--rose);margin-bottom:22px}

/* Floating hearts + tap sparkles */
.fh{position:absolute;bottom:-40px;will-change:transform,opacity;animation:rise linear forwards;opacity:0}
@keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}12%{opacity:.75}100%{transform:translateY(-110vh) translateX(var(--dx)) scale(1.1) rotate(var(--r));opacity:0}}
.tap{position:absolute;pointer-events:none;will-change:transform,opacity;animation:pop .9s ease-out forwards}
@keyframes pop{to{transform:translate(var(--x),var(--y)) scale(.4);opacity:0}}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.2s!important}}
</style>
</head>
<body>

<canvas id="fx"></canvas>
<div id="hearts"></div>
<div id="taps"></div>

<!-- Sound button (appears after the gift is tapped) -->
<button class="ctrl" id="muteBtn" aria-label="Sound on/off">🔊</button>

<!-- ========== 1. GIFT SCREEN ========== -->
<section class="screen on" id="gift-screen">
  <h1 class="hello">Hey… I made something special for you 💗</h1>
  <p class="sub">There’s a little surprise waiting inside…</p>
  <div class="gift" id="gift" role="button" aria-label="Open your gift">
    <div class="beam"></div>
    <div class="box"></div>
    <div class="lid"><div class="bow"><i></i><i></i></div></div>
  </div>
  <p class="hint">tap the gift</p>
</section>

<!-- ========== 2. VIDEO SCREEN ========== -->
<section class="screen" id="video-screen">
  <div class="stage">
    <!--
      ★★★ YOUR VIDEO GOES HERE ★★★
      Put your video file in the same folder and name it:  surprise-video.mp4
      (Different name? Just change the src below.)
    -->
    <video id="vid" src="surprise-video.mp4" playsinline preload="auto"></video>

    <!-- Shown automatically if the video file is missing -->
    <div class="glass" id="ph">
      <div class="serif">Your video lives here 🎬</div>
      <p>Add <b>surprise-video.mp4</b> and it will play right here.</p>
      <button class="btn" id="phNext">Continue 💗</button>
    </div>

    <button class="ctrl" id="fsBtn" aria-label="Full screen">⛶</button>
    <div class="bar"><b id="prog"></b></div>
  </div>
</section>

<!-- ========== 3. FINAL SCREEN ========== -->
<section class="screen" id="final">
  <h1 class="m1 fade" id="m1">That was just a little piece of what you mean to me… ❤️</h1>
  <div class="glass m2 fade hide" id="m2"></div>
  <div class="heart fade" id="heartBig">❤️</div>
  <div class="row fade" id="moreRow"><button class="btn" id="moreBtn">One More Surprise 💌</button></div>
</section>

<!-- ========== 4. HIDDEN MESSAGE ========== -->
<div id="secret">
  <div class="glass">
    <div class="serif" id="sTitle"></div>
    <p id="sBody"></p>
    <div class="sig" id="sSig"></div>
    <button class="btn ghost" id="replayBtn">Watch it again ↺</button>
  </div>
</div>

<!--
  ★★★ YOUR MUSIC GOES HERE ★★★
  Put your song in the same folder and name it:  love-song.mp3
  If the file is missing, the site simply stays silent (nothing breaks).
-->
<audio id="music" src="love-song.mp3" loop preload="auto"></audio>

<script>
/* ============ EDIT YOUR WORDS HERE ============ */
const TEXT = {
  typed: "Some people become a beautiful part of our story without even trying. You are one of those people. 🫶✨",
  secretTitle: "Thank you for being you 💗",
  secretBody: "Whatever happens, wherever life takes us — I’m really glad you’re in my story. Never forget how special you are.",
  signature: "— Always yours"
};

/* ============ HELPERS ============ */
const $ = s => document.querySelector(s);
const wait = ms => new Promise(r => setTimeout(r, ms));
const vid = $('#vid'), music = $('#music'), muteBtn = $('#muteBtn');
let muted = false, started = false, finished = false;

function show(id){ document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); }
function setVolume(){ music.volume = vid.classList.contains('ready') && !vid.ended && screenOn('video-screen') ? .12 : .55; }
function screenOn(id){ return $('#'+id).classList.contains('on'); }

/* ============ CANVAS: stars, dust, confetti ============ */
const cv = $('#fx'), ctx = cv.getContext('2d');
let W, H, DPR = Math.min(window.devicePixelRatio || 1, 2);
function resize(){ W = innerWidth; H = innerHeight; cv.width = W*DPR; cv.height = H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }
addEventListener('resize', resize); resize();

const stars = Array.from({length: innerWidth < 600 ? 55 : 110}, () => ({
  x: Math.random(), y: Math.random(), r: Math.random()*1.4+.3, p: Math.random()*6.28, s: Math.random()*.02+.005,
  dy: Math.random()*.00006+.00002
}));
let confetti = [];
const COLORS = ['#ff4d8d','#ff8fb3','#ffd0e0','#ff3b5c','#c58bff','#fff2f7'];

function burst(x, y, n = 90){
  for (let i = 0; i < n; i++){
    const a = Math.random()*Math.PI*2, v = Math.random()*9+3;
    confetti.push({ x, y, vx: Math.cos(a)*v, vy: Math.sin(a)*v - 5, w: Math.random()*8+4, h: Math.random()*5+3,
      rot: Math.random()*6, vr: (Math.random()-.5)*.4, c: COLORS[i % COLORS.length], life: 1, heart: Math.random() < .25 });
  }
}
function drawHeart(x, y, s){
  ctx.beginPath(); ctx.moveTo(x, y + s*.3);
  ctx.bezierCurveTo(x, y - s*.3, x - s, y - s*.3, x - s, y + s*.3);
  ctx.bezierCurveTo(x - s, y + s*.8, x, y + s*1.1, x, y + s*1.4);
  ctx.bezierCurveTo(x, y + s*1.1, x + s, y + s*.8, x + s, y + s*.3);
  ctx.bezierCurveTo(x + s, y - s*.3, x, y - s*.3, x, y + s*.3); ctx.fill();
}
function loop(){
  ctx.clearRect(0, 0, W, H);
  for (const s of stars){
    s.p += s.s; s.y -= s.dy; if (s.y < 0) s.y = 1;
    ctx.globalAlpha = .35 + Math.sin(s.p)*.35; ctx.fillStyle = '#ffe3f0';
    ctx.beginPath(); ctx.arc(s.x*W, s.y*H, s.r, 0, 6.28); ctx.fill();
  }
  for (let i = confetti.length - 1; i >= 0; i--){
    const c = confetti[i];
    c.vy += .22; c.vx *= .985; c.x += c.vx; c.y += c.vy; c.rot += c.vr; c.life -= .006;
    if (c.life <= 0 || c.y > H + 30){ confetti.splice(i, 1); continue; }
    ctx.globalAlpha = Math.min(1, c.life*1.6); ctx.fillStyle = c.c;
    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.rot);
    c.heart ? drawHeart(0, -4, 5) : ctx.fillRect(-c.w/2, -c.h/2, c.w, c.h);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(loop);
}
loop();

/* ============ FLOATING HEARTS + TAP SPARKLES ============ */
const heartsEl = $('#hearts'), tapsEl = $('#taps');
const HEARTS = ['❤️','💗','💖','💕','✨'];
function floatHeart(){
  if (document.hidden || heartsEl.childElementCount > 14) return;
  const h = document.createElement('span'); h.className = 'fh';
  h.textContent = HEARTS[Math.random()*HEARTS.length | 0];
  h.style.left = Math.random()*100 + 'vw'; h.style.fontSize = (Math.random()*16 + 12) + 'px';
  h.style.animationDuration = (Math.random()*6 + 9) + 's';
  h.style.setProperty('--dx', (Math.random()*80 - 40) + 'px'); h.style.setProperty('--r', (Math.random()*50 - 25) + 'deg');
  heartsEl.appendChild(h); setTimeout(() => h.remove(), 16000);
}
setInterval(floatHeart, 1100);

let lastTap = 0;
function sparkle(x, y, n = 6){
  for (let i = 0; i < n; i++){
    const t = document.createElement('span'); t.className = 'tap';
    t.textContent = ['✨','💗','✦','💖'][Math.random()*4 | 0];
    t.style.left = x + 'px'; t.style.top = y + 'px'; t.style.fontSize = (Math.random()*10 + 10) + 'px';
    const a = Math.random()*6.28, d = Math.random()*50 + 25;
    t.style.setProperty('--x', Math.cos(a)*d + 'px'); t.style.setProperty('--y', Math.sin(a)*d - 20 + 'px');
    tapsEl.appendChild(t); setTimeout(() => t.remove(), 950);
  }
}
document.addEventListener('pointerdown', e => {
  const now = Date.now(); if (now - lastTap < 120) return; lastTap = now; sparkle(e.clientX, e.clientY, 5);
});

/* ============ SOUND ============ */
function startMusic(){ music.volume = .55; music.play().catch(() => {}); }
muteBtn.onclick = () => {
  muted = !muted; music.muted = muted; vid.muted = muted;
  muteBtn.textContent = muted ? '🔇' : '🔊';
};

/* ============ 1 → 2: OPEN THE GIFT ============ */
$('#gift').addEventListener('click', async () => {
  if (started) return; started = true;
  const g = $('#gift'), r = g.getBoundingClientRect();
  g.classList.add('open'); $('.hint').style.opacity = 0;
  startMusic(); muteBtn.classList.add('show');
  await wait(450);
  burst(r.left + r.width/2, r.top + 40, 110); sparkle(r.left + r.width/2, r.top + 30, 16);
  for (let i = 0; i < 8; i++) setTimeout(floatHeart, i*120);
  document.body.classList.add('emo');
  await wait(2000);
  show('video-screen'); playVideo();
});

/* ============ 2: VIDEO ============ */
function playVideo(){
  document.body.classList.remove('emo');
  vid.currentTime = 0; vid.muted = muted; vid.volume = 1;
  const p = vid.play();
  if (p) p.catch(() => {                       // autoplay blocked → let the user tap
    $('#ph').classList.add('on'); $('#ph .serif').textContent = 'Tap to play 💗';
    $('#ph p').textContent = 'Your surprise is ready.';
    $('#phNext').textContent = 'Play ▶';
    $('#phNext').onclick = () => { $('#ph').classList.remove('on'); vid.play(); };
  });
}
vid.addEventListener('loadeddata', () => { vid.classList.add('ready'); $('#ph').classList.remove('on'); });
vid.addEventListener('play', () => { setVolume(); });
vid.addEventListener('timeupdate', () => { $('#prog').style.width = (vid.currentTime / (vid.duration || 1) * 100) + '%'; });
vid.addEventListener('ended', goFinal);
vid.addEventListener('error', () => {           // no video file yet → pretty placeholder

});
$('#phNext').onclick = goFinal;                  // used by the placeholder
vid.addEventListener('click', () => vid.paused ? vid.play() : vid.pause());
$('#fsBtn').onclick = async () => {
  try {
    const el = $('.stage');
    if (document.fullscreenElement) { await document.exitFullscreen(); return; }
    await (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
    if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {});
  } catch(e){}
};
// If the file is missing, the error event may fire before the gift is opened — show the placeholder when the screen opens.
setTimeout(() => { if (vid.error) $('#ph').classList.add('on'); }, 0);

/* ============ 3: FINAL SCREEN ============ */
async function typeInto(el, text, speed = 55){
  el.classList.add('caret'); el.textContent = '';
  for (const ch of Array.from(text)){ el.textContent += ch; await wait(ch === '.' ? speed*6 : speed); }
  el.classList.remove('caret');
}
async function goFinal(){
  if (finished) return; finished = true;
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  vid.pause(); $('#ph').classList.remove('on');
  show('final'); document.body.classList.add('emo'); setVolume(); music.volume = .6;
  await wait(900);   $('#m1').classList.add('in');
  await wait(2600);  const m2 = $('#m2'); m2.classList.remove('hide'); m2.classList.add('in');
  await typeInto(m2, TEXT.typed);
  await wait(500);   $('#heartBig').classList.add('in');
  await wait(900);   $('#moreRow').classList.add('in');
}

/* ============ 4: HIDDEN MESSAGE ============ */
$('#moreBtn').onclick = () => {
  $('#sTitle').textContent = TEXT.secretTitle; $('#sBody').textContent = TEXT.secretBody; $('#sSig').textContent = TEXT.signature;
  $('#secret').classList.add('on');
  burst(innerWidth/2, innerHeight*.55, 80);
  for (let i = 0; i < 10; i++) setTimeout(floatHeart, i*150);
};

/* ============ REPLAY ============ */
$('#replayBtn').onclick = async () => {
  $('#secret').classList.remove('on');
  await wait(900);
  ['m1','m2','heartBig','moreRow'].forEach(id => $('#'+id).classList.remove('in'));
  $('#m2').classList.add('hide'); $('#m2').textContent = '';
  document.body.classList.remove('emo'); finished = false;
  $('#prog').style.width = '0'; show('video-screen'); playVideo();
};

/* Block accidental scroll/zoom gestures */
['touchmove','gesturestart'].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), {passive:false}));
document.addEventListener('visibilitychange', () => { if (document.hidden) music.pause(); else if (started && !muted) music.play().catch(() => {}); });
</script>
</body>
</html>
